name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository. No secrets are used anywhere:
# no Google cookies, no tokens, and no real NotebookLM create/upload calls.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Third-party actions are pinned to full commit SHAs (tags can be moved):
  #   actions/checkout    v4.2.2  11bd71901bbe5b1630ceea73d27597364c9af683
  #   astral-sh/setup-uv  v6.8.0  d0cc045d04ccac9d8b7881df0226f9e82c39688e
  UV_NO_PROGRESS: "1"
  NO_COLOR: "1"

jobs:
  test:
    name: test / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Python 3.12 everywhere it matters; 3.11 (the minimum supported) on the cheapest runner
      # and on Windows (where most platform quirks live). macOS runs 3.12 only (costly minutes).
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg + CJK font (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-wqy-microhei

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Offline tests
        run: uv run pytest -q

      - name: CLI smoke (dev environment; required, no ignored failures)
        run: uv run python scripts/ci_smoke.py --cmd "python -m bili2nb"

  install-as-tool:
    # Mirrors the README install path: `uv tool install` into an isolated env, then run the
    # global launcher from outside the project (no venv activation).
    name: tool install / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install ffmpeg + CJK font (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-wqy-microhei

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: uv tool install
        run: uv tool install . --overrides overrides.txt --python ${{ matrix.python }}

      - name: Smoke-test the installed global command from another directory
        shell: bash
        run: |
          export PATH="$(uv tool dir --bin):$PATH"
          cd "$HOME"
          bili2nb --help > /dev/null
          bili2notebooklm --help > /dev/null
          python "$GITHUB_WORKSPACE/scripts/ci_smoke.py" --cmd bili2nb
          python "$GITHUB_WORKSPACE/scripts/ci_smoke.py" --cmd bili2notebooklm

  negative-control:
    # Proves the smoke check can FAIL: with a deliberately wrong expected exit code the script
    # must exit non-zero. If this job ever goes red, the smoke check has stopped being a check.
    name: negative control (the smoke check must fail on a wrong exit code)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Install ffmpeg + CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-wqy-microhei
      - run: uv sync
      - name: Wrong expectation must be rejected
        shell: bash
        run: |
          if uv run python scripts/ci_smoke.py --cmd "python -m bili2nb" --expect-auth-exit 21; then
            echo "::error::smoke check accepted a WRONG exit code; it can no longer fail"
            exit 1
          fi
          echo "OK: the smoke check failed as intended"
